flutter_launcher_icons:
  android: false  # Android icons are per flavour in android/app/src/{main,pro}/res
  ios: true
  image_path: "assets/app/icon_free.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: false
    image_path: "assets/app/icon_free.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: false
    image_path: "assets/app/icon_free.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: false
    image_path: "assets/app/icon_free.png"