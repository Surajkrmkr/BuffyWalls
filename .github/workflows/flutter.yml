name: BuffyWalls Build Generation For Android

on:
  push:
    branches:
      - buffy-free
      - buffy-pro

permissions:
  contents: write

jobs:
  build-and-release-buffywalls:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup Env Variables (Common)
        run: |
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV
          echo "BUFFY_URL=${{ secrets.ENV_BUFFY_URL }}" >> $GITHUB_ENV
          echo "ONBOARD_URL=${{ secrets.ENV_ONBOARD_URL }}" >> $GITHUB_ENV
          echo "FREE_BUFFY=${{ secrets.ENV_FREE_BUFFY }}" >> $GITHUB_ENV
          echo "PAID_BUFFY=${{ secrets.ENV_PAID_BUFFY }}" >> $GITHUB_ENV
          echo "SIGNING_KEY_STORE_PATH=${{ secrets.SIGNING_KEY_STORE_PATH }}" >> $GITHUB_ENV
      - name: Setup Env Variables (Free)
        if: ${{ github.ref_name == 'buffy-free' }}
        run: |
          echo "BUFFY=${{ secrets.ENV_FREE_BUFFY }}" >> $GITHUB_ENV
          echo "SIGNING_KEY_STORE_BASE64=${{ secrets.FREE_SIGNING_KEY_STORE_BASE64 }}" >> $GITHUB_ENV
          echo "ENV_FILE =${{ secrets.FREE_ENV }}" >> $GITHUB_ENV
      - name: Setup Env Variables (Pro)
        if: ${{ github.ref_name == 'buffy-pro' }}
        run: |
          echo "BUFFY=${{ secrets.ENV_PAID_BUFFY }}" >> $GITHUB_ENV
          echo "SIGNING_KEY_STORE_BASE64=${{ secrets.PAID_SIGNING_KEY_STORE_BASE64 }}" >> $GITHUB_ENV
          echo "ENV_FILE =${{ secrets.PAID_ENV }}" >> $GITHUB_ENV
      - name: Decode Keystore
        run: |
          echo $SIGNING_KEY_STORE_BASE64 > keystore-b64.txt
          base64 -d keystore-b64.txt > $SIGNING_KEY_STORE_PATH
      - name: Create env file
        uses: iamsauravsharma/create-dotenv@v2.0.1
        env:
          BUFFY: $BUFFY
          FREE: $FREE_BUFFY
          PAID: $PAID_BUFFY
          URL: $BUFFY_URL
          ONBOARD_URL: $ONBOARD_URL
      - name: Read App version from Pubspec YAML
        id: app-version
        uses: jbutcher5/read-yaml@main
        with:
          file: "pubspec.yaml"
          key-path: '["version"]'
      - name: Configure Service Account JSON
        run: |
          echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > service_account.json
      - name: Setup Java to compile the project
        uses: actions/setup-java@v1
        with:
          java-version: "12.x"
      - name: Install and setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:" # optional, change this to force refresh cache
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:" # optional, change this to specify the cache path
          architecture: x64 # optional, x64 or arm64
      - run: flutter --version
      - name: Install project dependencies
        run: flutter pub get
      - name: Generate intermediates
        run: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Flutter Build Release for Android (Pro)
        if: ${{ github.ref_name == 'buffy-pro' }}
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.PAID_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          flutter build appbundle --release --flavor paid
      - name: Flutter Build Release for Android (Free)
        if: ${{ github.ref_name == 'buffy-free' }}
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.FREE_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          flutter build apk --split-per-abi --release --flavor free
          flutter build appbundle --release --flavor free
      - name: Archive Release
        uses: thedoctor0/zip-release@master
        with:
          type: "zip"
          filename: BuffyWalls-${{steps.app-version.outputs.data}}.zip
          directory: build/app/outputs/flutter-apk/
      - name: Android Release
        uses: softprops/action-gh-release@v1
        if: ${{ github.ref_name == 'buffy-free' }}
        with:
          tag_name: ${{ steps.app-version.outputs.data }}
          files: build/app/outputs/flutter-apk/BuffyWalls-${{ steps.app-version.outputs.data }}.zip
      - name: Upload Release to Play store (Pro)
        uses: r0adkll/upload-google-play@v1
        if: ${{ github.ref_name == 'buffy-pro' }}
        with:
          serviceAccountJson: service_account.json
          packageName: com.shadowteam.buffywallspaid
          releaseFiles: build/app/outputs/bundle/paidRelease/app-paid-release.aab
          mappingFile: build/app/outputs/mapping/paidRelease/mapping.txt
          debugSymbols: build/app/intermediates/merged_native_libs/paidRelease/out/lib
          whatsNewDirectory: distribution/whatsnew
          changesNotSentForReview: true
          releaseName: ${{ steps.app-version.outputs.data }}
          track: alpha
          status: completed
          inAppUpdatePriority: 2
      - name: Upload Release to Play store (Free)
        uses: r0adkll/upload-google-play@v1
        if: ${{ github.ref_name == 'buffy-free' }}
        with:
          serviceAccountJson: service_account.json
          packageName: com.shadowteam.buffywallsfree
          releaseFiles: build/app/outputs/bundle/freeRelease/app-free-release.aab
          mappingFile: build/app/outputs/mapping/freeRelease/mapping.txt
          debugSymbols: build/app/intermediates/merged_native_libs/freeRelease/out/lib
          whatsNewDirectory: distribution/whatsnew
          releaseName: ${{ steps.app-version.outputs.data }}
          changesNotSentForReview: true
          track: production
          status: completed
          inAppUpdatePriority: 2
