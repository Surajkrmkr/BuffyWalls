buildscript {
    ext.kotlin_version = '2.1.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.3.15'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.5'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    
    repositories.configureEach { repo ->
        if (repo instanceof MavenArtifactRepository && repo.url.toString().contains("jitpack.io")) {
            repo.content {
                excludeModule("me.carda", "androidcore")
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

subprojects {
    if (project.state.executed) {
        configureSubproject(project)
    } else {
        project.afterEvaluate { configureSubproject(project) }
    }
}

void configureSubproject(Project project) {
    if (project.hasProperty('android')) {
        project.android {
            compileSdkVersion 36
            if (namespace == null) {
                namespace = project.group ?: "com.shadowteam.buffywallsfree.${project.name}"
            }
        }
    }
    project.tasks.configureEach { task ->
        if (task.name.contains("verifyReleaseResources")) {
            task.enabled = false
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
