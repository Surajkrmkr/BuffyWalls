name: buffywalls
description: A Wallpaper app
publish_to: "none"
version: 2.0.6+27

environment:
  sdk: ">=3.0.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  animations: ^2.1.2
  async_wallpaper: ^3.1.0
  build_runner: ^2.13.1
  cached_network_image: ^3.3.1
  change_app_package_name: ^1.5.0
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  double_back_to_close_app: ^2.1.0
  # firebase_analytics: ^10.7.4
  firebase_app_check: ^0.2.1+8
  firebase_core: ^2.24.2
  firebase_crashlytics: ^3.4.8
  firebase_messaging: ^14.7.10
  flex_color_picker: ^3.8.0
  flutter_cache_manager: ^3.3.1
  flutter_launcher_icons: ^0.14.4
  flutter_local_notifications: ^21.0.0
  flutter_native_splash: ^2.4.7
  flutter_staggered_grid_view: ^0.7.0
  icons_launcher: ^3.1.0
  image_picker: ^1.2.1
  injectable: ^2.3.2
  logger: ^2.7.0
  lottie: ^3.3.3
  palette_generator: ^0.3.3+3
  path_provider: ^2.1.5
  permission_handler: ^11.2.0
  provider: ^6.1.1
  shared_preferences: ^2.5.5
  stacked: ^3.5.0
  stacked_services: ^1.6.0
  url_launcher: ^6.2.4
  skeletonizer: ^2.1.3
  flutter_svg: ^2.2.4
  collection: ^1.19.1
  flutter_dotenv: ^6.0.0
  android_path_provider: ^0.3.0
  in_app_purchase: ^3.2.3
  animated_text_kit: ^4.3.0
  google_mobile_ads: ^8.0.0
  in_app_update: ^4.2.5
  package_info_plus: ^10.1.0
  share_plus: ^13.1.0
  fluttertoast: ^9.0.0
  firebase_analytics: ^10.10.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  mockito: ^5.4.1
  stacked_generator: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - distribution/whatsnew/whatsnew-en-US
    - assets/svgs/
    - assets/svgs/settings/
    - assets/app/
    - assets/lottie/
    - .env

  fonts:
    - family: Gilroy
      fonts:
        - asset: fonts/Gilroy-Light.ttf
          weight: 300
        - asset: fonts/Gilroy-Regular.ttf
          weight: 500
        - asset: fonts/Gilroy-Medium.ttf
          weight: 700
        - asset: fonts/Gilroy-Bold.ttf
          weight: 800
